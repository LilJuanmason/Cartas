<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Relatos de amor, para mi amor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Banner -->
  <header class="banner">
    <img src="imagenes/icono-izq.png" class="icono izquierda">
    <h1>Relatos de amor, para mi amor</h1>
    <img src="imagenes/icono-der.png" class="icono derecha">
  </header>

  <!-- Intro -->
  <p class="intro">
    Esta página está hecha con todo mi amor y cariño, la cual servirá para que tengas un lugar donde ver algunos textos que escribiré para ti aparte de las cartas en papel.
  </p>

  <!-- Últimos -->
  <div class="seccion">
    <span>Últimos</span>
  </div>

  <section id="ultimos"></section>

  <!-- Estadísticas -->
  <div class="stats">
    <div class="stat-card" id="dias-juntos">
      <h3>Días juntos</h3>
      <p>0</p>
    </div>

    <div class="stat-card" id="cartas-escritas">
      <h3>Cartas escritas</h3>
      <p>0</p>
    </div>

    <div class="stat-card proximamente">
      <h3>Próximamente</h3>
    </div>
  </div>

  <!-- Archivo -->
  <div class="seccion">
    <span>Archivo completo</span>
  </div>

  <section id="archivo"></section>

  <!-- Scripts -->
  <script src="app.js"></script>

</body>
</html>
